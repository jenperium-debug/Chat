<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryzen Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0b0e14;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #chat {
            background: #161c26;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #messages::-webkit-scrollbar {
            width: 5px;
        }
        #messages::-webkit-scrollbar-track {
            background: #1e2632;
            border-radius: 10px;
        }
        #messages::-webkit-scrollbar-thumb {
            background: #3b8aff;
            border-radius: 10px;
        }
        .msg {
            background: #1e2632;
            padding: 10px 14px;
            border-radius: 14px;
            color: #e8edf5;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 15px;
            border-left: 3px solid #3b8aff;
            align-self: flex-start;
            animation: fade 0.2s ease;
        }
        .msg.me {
            background: #2a3a5c;
            border-left-color: #7cb9ff;
            align-self: flex-end;
        }
        .msg .time {
            font-size: 10px;
            color: #8895aa;
            display: block;
            margin-top: 4px;
            text-align: right;
        }
        @keyframes fade {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #input-area {
            display: flex;
            gap: 10px;
        }
        #input-area input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 30px;
            background: #1e2632;
            color: #e8edf5;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }
        #input-area input:focus {
            background: #262f3d;
            box-shadow: 0 0 0 2px #3b8aff66;
        }
        #input-area button {
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            background: #3b8aff;
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        #input-area button:hover {
            background: #5a9cff;
            transform: scale(1.02);
        }
        #status {
            text-align: center;
            color: #5d6f86;
            font-size: 13px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div id="chat">
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="msgInput" placeholder="Напишите сообщение..." autofocus>
        <button id="sendBtn">➤</button>
    </div>
    <div id="status">🟢 Подключено</div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
    // ============================================================
    // 1. ВСТАВЬТЕ СВОИ ДАННЫЕ ИЗ FIREBASE
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyDummyKeyReplaceMe",
        authDomain: "your-project.firebaseapp.com",
        databaseURL: "https://your-project-default-rtdb.firebaseio.com",
        projectId: "your-project",
        storageBucket: "your-project.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef"
    };

    // ============================================================
    // 2. ИНИЦИАЛИЗАЦИЯ
    // ============================================================
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const messagesRef = db.ref('chat_messages');

    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const messagesDiv = document.getElementById('messages');
    const statusDiv = document.getElementById('status');

    let userName = 'Аноним';

    // Запрос имени при первом входе
    const nameInput = prompt('Введите ваше имя (будет отображаться в чате):');
    if (nameInput && nameInput.trim() !== '') {
        userName = nameInput.trim();
    }

    // ============================================================
    // 3. ОТПРАВКА СООБЩЕНИЯ
    // ============================================================
    function sendMessage() {
        const text = msgInput.value.trim();
        if (text === '') return;

        const message = {
            name: userName,
            text: text,
            timestamp: firebase.database.ServerValue.TIMESTAMP
        };

        messagesRef.push(message);
        msgInput.value = '';
        msgInput.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // ============================================================
    // 4. ПОЛУЧЕНИЕ СООБЩЕНИЙ В РЕАЛЬНОМ ВРЕМЕНИ
    // ============================================================
    messagesRef.orderByChild('timestamp').limitToLast(100).on('child_added', (snapshot) => {
        const data = snapshot.val();
        const msgDiv = document.createElement('div');
        msgDiv.className = 'msg';

        // Если это наше сообщение — добавляем класс "me"
        if (data.name === userName) {
            msgDiv.classList.add('me');
        }

        // Форматируем время
        const time = data.timestamp ? new Date(data.timestamp) : new Date();
        const timeStr = time.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

        msgDiv.innerHTML = `
            <strong>${data.name}</strong><br>
            ${data.text}
            <span class="time">${timeStr}</span>
        `;

        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        // Обновляем статус
        statusDiv.textContent = '🟢 Онлайн · ' + new Date().toLocaleTimeString();
    });

    // ============================================================
    // 5. ОБРАБОТКА ОШИБОК ПОДКЛЮЧЕНИЯ
    // ============================================================
    const connectedRef = firebase.database().ref('.info/connected');
    connectedRef.on('value', (snap) => {
        if (snap.val() === true) {
            statusDiv.textContent = '🟢 Подключено';
        } else {
            statusDiv.textContent = '🔴 Ожидание соединения...';
        }
    });

    // ============================================================
    // 6. ПРИ ВХОДЕ ФОКУС НА ПОЛЕ ВВОДА
    // ============================================================
    window.addEventListener('load', () => {
        msgInput.focus();
    });
</script>

</body>
</html>
